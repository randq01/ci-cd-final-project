apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: ci-cd-pipeline
spec:
  workspaces:
    - name: shared-workspace
    - name: dockerconfig

  tasks:
    - name: cleanup
      taskRef:
        name: cleanup
      workspaces:
        - name: source
          workspace: shared-workspace

    - name: clone
      runAfter:
        - cleanup
      taskRef:
        name: git-clone
        kind: ClusterTask
      params:
        - name: url
          value: https://github.com/randq01/ci-cd-final-project.git
        - name: revision
          value: main
      workspaces:
        - name: output
          workspace: shared-workspace

    - name: lint
      runAfter:
        - clone
      taskRef:
        name: lint
      workspaces:
        - name: source
          workspace: shared-workspace

    - name: test
      runAfter:
        - clone
      taskRef:
        name: nose
      workspaces:
        - name: source
          workspace: shared-workspace

    - name: build
      runAfter:
        - lint
        - test
      taskRef:
        name: buildah
        kind: ClusterTask
      params:
        - name: IMAGE
          value: us.icr.io/sn-labs-h541969/ci-cd-final-project:latest
      workspaces:
        - name: source
          workspace: shared-workspace
        - name: dockerconfig
          workspace: dockerconfig

    - name: deploy
      runAfter:
        - build
      taskRef:
        name: openshift-client
        kind: ClusterTask
      params:
        - name: SCRIPT
          value: |
            oc set image deployment/ci-cd-final-project ci-cd-final-project=us.icr.io/sn-labs-h541969/ci-cd-final-project:latest
            oc rollout restart deployment/ci-cd-final-project
            oc rollout status deployment/ci-cd-final-project --timeout=120s

